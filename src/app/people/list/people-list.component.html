<mat-drawer-container class="h-full bg-canvas! text-body!" [hasBackdrop]="false">
  <mat-drawer class="w-full! rounded-none! border-l! border-outline/60! bg-surface! shadow-[-12px_0_32px_-18px_rgba(15,23,42,0.26)]! md:w-[560px]! md:rounded-l-2xl!" position="end" mode="over" [opened]="detailsOpen()" [disableClose]="true"
    (keydown.escape)="closeDetails(); $event.stopPropagation()" role="dialog" aria-labelledby="details-title">
    <router-outlet />
  </mat-drawer>
  <mat-drawer-content>
    <section class="flex h-full flex-col" aria-labelledby="people-title">
      <header class="border-b border-outline/60 bg-surface px-6 py-6 md:px-8 md:py-7">
        <h1 class="text-[30px] leading-9 font-semibold tracking-tight text-primary" id="people-title">People</h1>
        <p class="mt-3 mb-5 inline-flex items-center rounded-md border border-outline/70 bg-surface-muted px-2.5 py-1 text-xs font-medium text-body" role="status">{{ filtered().length }} people</p>
        <div class="flex flex-wrap items-center gap-4">
          <mat-form-field appearance="outline" subscriptSizing="dynamic" class="min-w-40 flex-1">
            <mat-label>Filter by name</mat-label>
            <input matInput type="search" [value]="query()" (input)="filter($any($event.target).value)" />
          </mat-form-field>
          <button mat-flat-button color="accent" (click)="addPerson()">Add person</button>
        </div>
      </header>
      <div class="flex gap-4 border-b border-outline/60 bg-surface-muted px-6 py-3 text-[11px] font-semibold uppercase tracking-[0.14em] text-primary md:px-8">
        @for (field of displayFields; track field.key) {
          <span class="min-w-0 flex-1 first:flex-[1.5]">{{ field.label }}</span>
        }
      </div>
      @if (peopleLoading()) {
        <div class="flex min-h-0 flex-1 items-center justify-center" role="status" aria-label="Loading people">
          <mat-spinner diameter="40" />
        </div>
      } @else if (peopleLoadError(); as error) {
        <div class="flex min-h-0 flex-1 flex-col items-center justify-center gap-3 p-6 text-center" role="alert">
          <mat-icon aria-hidden="true">error_outline</mat-icon>
          <p>{{ error }}</p>
          <button mat-flat-button color="accent" type="button" (click)="reloadPeople()">
            <mat-icon>refresh</mat-icon>
            Reload people
          </button>
        </div>
      } @else {
        <app-list listLabel="People list" emptyMessage="No people found." [items]="visible()" [columns]="displayFields" [selectedId]="detailsOpen() ? selectedId() : null" [hasMore]="hasMore()" (loadMore)="loadMore()" (itemSelected)="select($event)" />
      }
    </section>
  </mat-drawer-content>
</mat-drawer-container>
