<h2 mat-dialog-title id="add-person-title">Add person</h2>
<form [formGroup]="form" (ngSubmit)="save()" aria-labelledby="add-person-title">
  <mat-dialog-content>
    @for (field of fields; track field.key) {
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>{{ field.label }}</mat-label>
        <input matInput [name]="field.key" [formControlName]="field.key" required />
        <mat-error>{{ field.label }} is invalid.</mat-error>
      </mat-form-field>
    }
  </mat-dialog-content>
  <mat-dialog-actions>
    <button mat-button type="button" mat-dialog-close data-action="cancel">Cancel</button>
    <button mat-flat-button color="accent" type="submit">Save</button>
  </mat-dialog-actions>
</form>
