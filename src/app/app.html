<a class="sr-only focus:not-sr-only focus:fixed focus:z-50 focus:bg-white focus:p-4" href="#main-content">Skip to main content</a>
<mat-sidenav-container class="h-full bg-white! text-body!">
  <mat-sidenav class="w-60! rounded-none! border-r! border-outline! bg-primary-container!" [mode]="mobile() ? 'over' : 'side'"
    [opened]="!mobile() || menuOpen()" (closedStart)="menuOpen.set(false)">
    <header class="px-6 py-8 text-2xl font-bold tracking-widest text-primary">STAR WARS</header>
    <nav id="main-navigation" aria-label="Main navigation" class="space-y-2 px-4 py-2">
      <a class="block rounded-xl px-4 py-3.5 text-primary hover:bg-white aria-[current=page]:bg-primary aria-[current=page]:text-white aria-[current=page]:font-medium" routerLink="/start" routerLinkActive="" ariaCurrentWhenActive="page" (click)="menuOpen.set(false)">Start</a>
      <a class="block rounded-xl px-4 py-3.5 text-primary hover:bg-white aria-[current=page]:bg-primary aria-[current=page]:text-white aria-[current=page]:font-medium" routerLink="/people" routerLinkActive="" ariaCurrentWhenActive="page" (click)="menuOpen.set(false)">People</a>
    </nav>
  </mat-sidenav>
  <mat-sidenav-content>
    <div class="flex h-full flex-col">
      @if (mobile()) {
        <header class="flex items-center gap-4 bg-primary-container px-4 py-2 text-primary">
          <button mat-icon-button aria-label="Open navigation" aria-controls="main-navigation" [attr.aria-expanded]="menuOpen()" (click)="menuOpen.set(true)">&#9776;</button>
          <span>STAR WARS</span>
        </header>
      }
      @if (loading()) { <mat-progress-bar mode="indeterminate" aria-label="Loading page" /> }
      <main class="min-h-0 flex-1 overflow-auto" id="main-content" tabindex="-1" [attr.aria-busy]="loading()"><router-outlet /></main>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
