<a class="sr-only focus:not-sr-only focus:fixed focus:z-50 focus:bg-white focus:p-4" href="#main-content">Skip to main
  content</a>
<mat-sidenav-container class="h-full bg-white! text-body!">
  <mat-sidenav class="w-60! rounded-none! border-r! border-outline! bg-primary-container!"
    [mode]="mobile() ? 'over' : 'side'" [opened]="!mobile() || menuOpen()" (closedStart)="menuOpen.set(false)">
    <header class="border-b border-outline/60 px-6 py-8 text-2xl font-bold tracking-widest text-primary">STAR WARS</header>
    <nav id="main-navigation" aria-label="Main navigation" class="space-y-2 px-4 py-2 font-sans">
      <a class="flex items-center gap-3 rounded-xl px-4 py-3.5 text-[15px] font-medium text-primary hover:bg-white aria-[current=page]:bg-primary aria-[current=page]:text-white"
        routerLink="/start" routerLinkActive="" ariaCurrentWhenActive="page" (click)="menuOpen.set(false)">
        <svg class="h-5 w-5 shrink-0" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
          <path d="m3.5 10 8.5-7 8.5 7v10.5h-17V10Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
          <path d="M9 20.5v-6h6v6" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
        </svg>
        <span>Start</span>
      </a>
      <a class="flex items-center gap-3 rounded-xl px-4 py-3.5 text-[15px] font-medium text-primary hover:bg-white aria-[current=page]:bg-primary aria-[current=page]:text-white"
        routerLink="/people" routerLinkActive="" ariaCurrentWhenActive="page" (click)="menuOpen.set(false)">
        <svg class="h-5 w-5 shrink-0" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
          <circle cx="9" cy="8" r="3" stroke="currentColor" stroke-width="1.8" />
          <path d="M3.5 20v-1.1c0-2.55 2.45-4.4 5.5-4.4 1.1 0 2.1.24 2.92.66M15.5 5.1a3 3 0 0 1 0 5.8M15.2 14.55c2.9.2 5.3 1.9 5.3 4.35V20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </svg>
        <span>People</span>
      </a>
      <a class="flex items-center gap-3 rounded-xl px-4 py-3.5 text-[15px] font-medium text-primary hover:bg-white aria-[current=page]:bg-primary aria-[current=page]:text-white"
        routerLink="/vehicles" routerLinkActive="" ariaCurrentWhenActive="page" (click)="menuOpen.set(false)">
        <svg class="h-5 w-5 shrink-0" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
          <path d="M12 2.5c2.65 2.15 4.2 5.86 4.55 10.07l4.15 3.24v2.34l-6.12-2.1c-.54 1.5-1.37 2.91-2.58 4.2-1.21-1.29-2.04-2.7-2.58-4.2l-6.12 2.1v-2.34l4.15-3.24C7.8 8.36 9.35 4.65 12 2.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
          <circle cx="12" cy="10" r="1.25" fill="currentColor" />
          <path d="M10.2 15.7h3.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
        </svg>
        <span>Vehicles</span>
      </a>
      <a class="flex items-center gap-3 rounded-xl px-4 py-3.5 text-[15px] font-medium text-primary hover:bg-white aria-[current=page]:bg-primary aria-[current=page]:text-white"
        routerLink="/movies" routerLinkActive="" ariaCurrentWhenActive="page" (click)="menuOpen.set(false)">
        <svg class="h-5 w-5 shrink-0" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
          <rect x="4" y="4.5" width="16" height="15" rx="1.5" stroke="currentColor" stroke-width="1.6" />
          <path d="M8 4.5v15M16 4.5v15M4 9h4m-4 6h4m8-6h4m-4 6h4" stroke="currentColor" stroke-width="1.4" />
        </svg>
        <span>Movies</span>
      </a>
    </nav>
  </mat-sidenav>
  <mat-sidenav-content>
    <div class="flex h-full flex-col">
      @if (mobile()) {
      <header class="flex items-center gap-4 bg-primary-container px-4 py-2 text-primary">
        <button mat-icon-button aria-label="Open navigation" aria-controls="main-navigation"
          [attr.aria-expanded]="menuOpen()" (click)="menuOpen.set(true)">&#9776;</button>
        <span>STAR WARS</span>
      </header>
      }
      @if (loading()) { <mat-progress-bar mode="indeterminate" aria-label="Loading page" /> }
      <main class="min-h-0 flex-1 overflow-auto" id="main-content" tabindex="-1" [attr.aria-busy]="loading()">
        <router-outlet />
      </main>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
