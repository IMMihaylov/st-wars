<a
  class="sr-only fixed left-4 top-4 z-50 rounded-lg bg-white px-4 py-3 text-body shadow-lg focus:not-sr-only"
  href="#main-content"
  >Skip to main content</a
>
<mat-sidenav-container class="h-full bg-canvas! text-body!">
  <mat-sidenav
    class="w-64! rounded-none! border-r! border-white/10! bg-sidebar!"
    [mode]="mobile() ? 'over' : 'side'"
    [opened]="!mobile() || menuOpen()"
    (closedStart)="menuOpen.set(false)"
  >
    <div class="flex h-full flex-col px-3 py-5">
      <header class="flex items-center gap-3 px-3 pb-6 pt-1">
        <span
          class="grid size-10 shrink-0 place-items-center rounded-xl border border-white/10 bg-white/5 text-xs font-bold tracking-wide text-sidebar-accent"
          aria-hidden="true"
          >SW</span
        >
        <div class="min-w-0">
          <p class="text-xs font-semibold tracking-[0.2em] text-white">STAR WARS</p>
          <p class="mt-1 text-[11px] tracking-wide text-sidebar-muted">DATA ARCHIVE</p>
        </div>
      </header>

      <div class="mx-3 border-t border-white/10"></div>
      <nav id="main-navigation" aria-label="Main navigation" class="pt-6">
        <p class="px-3 pb-2 text-[10px] font-semibold uppercase tracking-[0.18em] text-sidebar-muted">
          Explore
        </p>
        <div class="space-y-1">
          <a
            class="group flex min-h-11 items-center gap-3 rounded-lg px-3 text-sm font-medium text-sidebar-muted transition-colors hover:bg-white/5 hover:text-white focus-visible:outline focus-visible:outline-2 focus-visible:outline-sidebar-accent aria-[current=page]:bg-sidebar-active aria-[current=page]:text-white"
            routerLink="/start"
            routerLinkActive=""
            ariaCurrentWhenActive="page"
            (click)="menuOpen.set(false)"
          >
            <svg class="size-[18px] shrink-0 text-current transition-colors group-aria-[current=page]:text-sidebar-accent" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
              <path d="m3.5 10 8.5-7 8.5 7v10.5h-17V10Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
              <path d="M9 20.5v-6h6v6" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
            </svg>
            <span>Start</span>
          </a>
          <a
            class="group flex min-h-11 items-center gap-3 rounded-lg px-3 text-sm font-medium text-sidebar-muted transition-colors hover:bg-white/5 hover:text-white focus-visible:outline focus-visible:outline-2 focus-visible:outline-sidebar-accent aria-[current=page]:bg-sidebar-active aria-[current=page]:text-white"
            routerLink="/people"
            routerLinkActive=""
            ariaCurrentWhenActive="page"
            (click)="menuOpen.set(false)"
          >
            <svg class="size-[18px] shrink-0 text-current transition-colors group-aria-[current=page]:text-sidebar-accent" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
              <circle cx="9" cy="8" r="3" stroke="currentColor" stroke-width="1.8" />
              <path d="M3.5 20v-1.1c0-2.55 2.45-4.4 5.5-4.4 1.1 0 2.1.24 2.92.66M15.5 5.1a3 3 0 0 1 0 5.8M15.2 14.55c2.9.2 5.3 1.9 5.3 4.35V20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            </svg>
            <span>People</span>
          </a>
          <a
            class="group flex min-h-11 items-center gap-3 rounded-lg px-3 text-sm font-medium text-sidebar-muted transition-colors hover:bg-white/5 hover:text-white focus-visible:outline focus-visible:outline-2 focus-visible:outline-sidebar-accent aria-[current=page]:bg-sidebar-active aria-[current=page]:text-white"
            routerLink="/vehicles"
            routerLinkActive=""
            ariaCurrentWhenActive="page"
            (click)="menuOpen.set(false)"
          >
            <svg class="size-[18px] shrink-0 text-current transition-colors group-aria-[current=page]:text-sidebar-accent" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
              <path d="M12 2.5c2.65 2.15 4.2 5.86 4.55 10.07l4.15 3.24v2.34l-6.12-2.1c-.54 1.5-1.37 2.91-2.58 4.2-1.21-1.29-2.04-2.7-2.58-4.2l-6.12 2.1v-2.34l4.15-3.24C7.8 8.36 9.35 4.65 12 2.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
              <circle cx="12" cy="10" r="1.25" fill="currentColor" />
              <path d="M10.2 15.7h3.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
            </svg>
            <span>Vehicles</span>
          </a>
          <a
            class="group flex min-h-11 items-center gap-3 rounded-lg px-3 text-sm font-medium text-sidebar-muted transition-colors hover:bg-white/5 hover:text-white focus-visible:outline focus-visible:outline-2 focus-visible:outline-sidebar-accent aria-[current=page]:bg-sidebar-active aria-[current=page]:text-white"
            routerLink="/movies"
            routerLinkActive=""
            ariaCurrentWhenActive="page"
            (click)="menuOpen.set(false)"
          >
            <svg class="size-[18px] shrink-0 text-current transition-colors group-aria-[current=page]:text-sidebar-accent" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
              <rect x="4" y="4.5" width="16" height="15" rx="1.5" stroke="currentColor" stroke-width="1.6" />
              <path d="M8 4.5v15M16 4.5v15M4 9h4m-4 6h4m8-6h4m-4 6h4" stroke="currentColor" stroke-width="1.4" />
            </svg>
            <span>Movies</span>
          </a>
        </div>
      </nav>
    </div>
  </mat-sidenav>

  <mat-sidenav-content class="bg-canvas!">
    <div class="flex h-full flex-col">
      @if (mobile()) {
        <header class="flex min-h-14 items-center gap-3 border-b border-outline/70 bg-surface px-4 text-body">
          <button
            mat-icon-button
            class="-ml-2!"
            aria-label="Open navigation"
            aria-controls="main-navigation"
            [attr.aria-expanded]="menuOpen()"
            (click)="menuOpen.set(true)"
          >
            <svg class="size-5" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
              <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            </svg>
          </button>
          <span class="text-xs font-semibold tracking-[0.18em] text-primary">STAR WARS</span>
        </header>
      }
      @if (loading()) { <mat-progress-bar mode="indeterminate" aria-label="Loading page" /> }
      <main
        class="min-h-0 flex-1 overflow-auto"
        id="main-content"
        tabindex="-1"
        [attr.aria-busy]="loading()"
      >
        <router-outlet />
      </main>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
